name: compile

on:
  push:
  pull_request:

jobs:
  ergo-6-0-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ergo 6.0.6 reference JAR
        shell: bash
        run: |
          curl -fL \
            https://github.com/ergoplatform/ergo/releases/download/v6.0.6/ergo-6.0.6.jar \
            -o "$RUNNER_TEMP/ergo-6.0.6.jar"
          echo "21b9023933b19b98b7eb4d50cb78bcb6c827a0fe65711a00ceaf1b83f8f3a323  $RUNNER_TEMP/ergo-6.0.6.jar" | sha256sum -c -

      - name: Safety guard source check
        run: python3 scripts/check_safety.py

      - name: Run safety unit tests
        shell: bash
        env:
          ERGO_JAR: ${{ runner.temp }}/ergo-6.0.6.jar
        run: |
          test -f src/test/scala/org/ergoplatform/nodeView/history/ErgoHistoryDoctorSafetySpec.scala
          ./scripts/sbt.sh 'show Test / definedTests' | tee "$RUNNER_TEMP/defined-tests.txt"
          grep -Fq 'ErgoHistoryDoctorSafetySpec' "$RUNNER_TEMP/defined-tests.txt"
          ./scripts/sbt.sh clean test

      - name: Package against Ergo 6.0.6
        shell: bash
        env:
          ERGO_JAR: ${{ runner.temp }}/ergo-6.0.6.jar
        run: |
          ./scripts/sbt.sh package
